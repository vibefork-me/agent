name: ci

# Linux: every push and PR. Windows and macOS: `main` and manual runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI builds from a cache: no incremental state, no debug info (smaller, faster to link and cache).
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Toolchains the engine tests install (Node LTS through mise).
          cache-directories: target/tmp/vf-engine-tools
          # The key follows rust-toolchain.toml, not the toolchains preinstalled on the runner image.
          add-rust-environment-hash-key: false
      - name: System libraries (Secret Service, tray)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Layers
        run: python3 scripts/check_layers.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  windows-macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Toolchains the engine tests install (Node LTS through mise).
          cache-directories: target/tmp/vf-engine-tools
          # The key follows rust-toolchain.toml, not the toolchains preinstalled on the runner image.
          add-rust-environment-hash-key: false
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
