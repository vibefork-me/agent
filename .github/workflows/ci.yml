name: ci

# Linux: every push and PR. Windows and macOS (2× and 10× the Linux minutes): weekly on `main`
# and manual runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

# CI builds from a cache: no incremental state, no debug info (smaller, faster to link and cache).
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Toolchains the engine tests install (Node LTS through mise).
          cache-directories: target/tmp/vf-engine-tools
          # The key follows rust-toolchain.toml, not the toolchains preinstalled on the runner image.
          add-rust-environment-hash-key: false
      - name: System libraries (Secret Service, tray)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Layers
        run: python3 scripts/check_layers.py
      - name: Dependency sources (crates.io and vibefork-me only, lockfile current)
        run: python3 scripts/check_sources.py
      - name: Installers (messages in every language)
        run: python3 scripts/generate-installers.py --check
      - name: Languages and glossary (shared list)
        run: python3 scripts/check_i18n.py
      - name: Canary (builds leave nothing in the home folder)
        run: cargo test -p vf-engine --test canary -- --ignored
      - name: Dev-only origins (feature on)
        run: cargo test -p vf-platform --features dev-extra-origins
      - name: Dev prompts dir (feature on)
        run: cargo test -p vf-platform --features dev-prompts-dir
      - name: Default build has no dev or insecure features
        run: |
          if cargo tree -p vf-agent -e features -i vf-platform | grep -E 'vf-platform feature "(dev-extra-origins|dev-prompts-dir|insecure-auto-approve|test-store)"'; then
            echo "a default vf-agent build enables a development-only feature" >&2
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  windows-macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Toolchains the engine tests install (Node LTS through mise).
          cache-directories: target/tmp/vf-engine-tools
          # The key follows rust-toolchain.toml, not the toolchains preinstalled on the runner image.
          add-rust-environment-hash-key: false
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Canary (builds leave nothing in the home folder)
        run: cargo test -p vf-engine --test canary -- --ignored
