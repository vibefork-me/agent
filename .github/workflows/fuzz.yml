name: fuzz

# libFuzzer on the parsers of untrusted input (fuzz/), 2 minutes per target. Weekly and manual.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [project_path, client_message, manifest, provider_stream, plan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly and cargo-fuzz
        run: rustup toolchain install nightly --profile minimal && cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
