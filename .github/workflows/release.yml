name: release

# A push to the `release` branch (version from `[workspace.package]`) or a manual run with a
# candidate version builds the agent and the tray for every platform and creates a **draft** GitHub
# Release "Vibefork v<version>": the binaries, the packages (`scripts/package.py`: the per-user
# Windows installer and a portable zip, the macOS disk image, the Linux AppImage with its `.zsync`
# and a `.tar.gz`), `install.ps1` and `install.sh` pinned to their hashes, `SHA256SUMS.txt`, and the
# release subkey certificate (`subkey.cert.json`, `subkey.cert.sig`). The signed update manifest (`manifest.json`, `manifest.sig`) is added to the
# draft offline (`scripts/sign_release.py`); a person publishes the draft.
# A pull request that changes the release build runs everything except the draft, and checks the
# assembled release with throwaway keys (`vibefork-sign verify`).

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version (X.Y.Z or X.Y.Z-pre); empty: the version in Cargo.toml"
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/generate-installers.py
      - scripts/sign_release.py
      - scripts/package.py
      - scripts/package/**
      - crates/vf-sign/**

permissions:
  contents: read

# Release runs are never cancelled; a newer push to a pull request cancels its older check.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  WIX_VERSION: 5.0.2
  # AppImage tools, pinned by SHA-256: appimagetool 1.9.1 and the type 2 runtime 20251108.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1
  APPIMAGETOOL_SHA256_X86_64: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGETOOL_SHA256_AARCH64: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
  RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108
  RUNTIME_SHA256_X86_64: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  RUNTIME_SHA256_AARCH64: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Version
        id: v
        env:
          CANDIDATE: ${{ inputs.version }}
        run: |
          if [ -n "$CANDIDATE" ]; then cargo xtask version set "$CANDIDATE"; fi
          echo "version=$(cargo xtask version)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, ext: .exe, native: true }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64, ext: .exe, native: false }
          - { runner: macos-latest, target: aarch64-apple-darwin, os: macos, arch: aarch64, ext: "", native: true }
          - { runner: macos-latest, target: x86_64-apple-darwin, os: macos, arch: x86_64, ext: "", native: false }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64, ext: "", native: true }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64, ext: "", native: true }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: System libraries (Secret Service, tray)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Version
        shell: bash
        run: |
          if [ "$(cargo xtask version)" != "$VERSION" ]; then cargo xtask version set "$VERSION"; fi
      # No build cache: release binaries are built from a clean state.
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p vf-agent -p vf-tray
      - name: Release files
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/vibefork${{ matrix.ext }}" "dist/vibefork-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/vibefork-tray${{ matrix.ext }}" "dist/vibefork-tray-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
      - name: The binary answers its version
        if: matrix.native
        shell: bash
        run: |
          out="$("dist/vibefork-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" version)"
          echo "$out"
          [ "$out" = "vibefork $VERSION" ]
      - name: Windows installer and portable zip
        if: matrix.os == 'windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix extension add -g "WixToolset.UI.wixext/$WIX_VERSION"
          wix extension add -g "WixToolset.Util.wixext/$WIX_VERSION"
          python scripts/package.py windows "$VERSION" ${{ matrix.arch }} dist dist
      # Per-user, without questions: the way the agent's self-update runs the installer.
      - name: The installer installs, the installed agent answers its version, it uninstalls
        if: matrix.os == 'windows' && matrix.native
        shell: pwsh
        run: |
          $msi = "distibefork-windows-${{ matrix.arch }}.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /passive /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programsibefork'
          $out = & "$diribefork.exe" version
          $out
          if ($out -ne "vibefork $env:VERSION") { exit 1 }
          if ((Get-Content "$diribefork.install") -ne 'msi') { exit 1 }
          $handler = (Get-ItemProperty 'HKCU:\Software\Classesibefork\shell\open\command').'(default)'
          $handler
          if ($handler -notlike "*vibefork.exe*handle*") { exit 1 }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /passive /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; exit 1 }
          if (Test-Path "$diribefork.exe") { Write-Error 'vibefork.exe is still installed'; exit 1 }
          if (Test-Path 'HKCU:\Software\Classesibefork') { Write-Error 'the link handler is still registered'; exit 1 }
      - name: AppImage and tar.gz
        if: matrix.os == 'linux'
        run: |
          arch=${{ matrix.arch }}
          tool_sha=$APPIMAGETOOL_SHA256_X86_64; runtime_sha=$RUNTIME_SHA256_X86_64
          if [ "$arch" = aarch64 ]; then tool_sha=$APPIMAGETOOL_SHA256_AARCH64; runtime_sha=$RUNTIME_SHA256_AARCH64; fi
          tools="$RUNNER_TEMP/appimage"; mkdir -p "$tools"
          curl -fsSL -o "$tools/appimagetool" "$APPIMAGETOOL_URL/appimagetool-$arch.AppImage"
          curl -fsSL -o "$tools/runtime" "$RUNTIME_URL/runtime-$arch"
          echo "$tool_sha  $tools/appimagetool" | sha256sum -c
          echo "$runtime_sha  $tools/runtime" | sha256sum -c
          chmod +x "$tools/appimagetool"
          python3 scripts/package.py linux "$VERSION" "$arch" dist dist --appimagetool "$tools/appimagetool" --runtime "$tools/runtime"
          out="$(APPIMAGE_EXTRACT_AND_RUN=1 "dist/vibefork-linux-$arch.AppImage" version)"
          echo "$out"
          [ "$out" = "vibefork $VERSION" ]
          tar -tzvf "dist/vibefork-linux-$arch.tar.gz"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The disk image holds one app for both processors, so it is made from both macOS builds.
  macos-dmg:
    needs: [version, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-macos-*
          path: bin
          merge-multiple: true
      - name: Disk image
        run: python3 scripts/package.py macos "$VERSION" bin dmg
      - name: The app holds both processors, its signature is consistent, the agent answers its version
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vf" dmg/vibefork-macos-universal.dmg
          app="$RUNNER_TEMP/vf/Vibefork.app"
          for bin in vibefork vibefork-tray; do lipo -archs "$app/Contents/MacOS/$bin" | grep -q 'x86_64 arm64'; done
          codesign --verify --deep --strict "$app"
          out="$("$app/Contents/MacOS/vibefork" version)"
          echo "$out"
          [ "$out" = "vibefork $VERSION" ]
          ls -la "$RUNNER_TEMP/vf"
          hdiutil detach "$RUNNER_TEMP/vf"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-macos-universal
          path: dmg/
          if-no-files-found: error

  assemble:
    needs: [version, build, macos-dmg]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: release
          merge-multiple: true
      - name: Installers, subkey certificate, checksums
        run: |
          python3 scripts/generate-installers.py "$VERSION" release release
          cp keys/release-sub.pub.cert.json release/subkey.cert.json
          cp keys/release-sub.pub.cert.sig release/subkey.cert.sig
          for os_arch in windows-x86_64 windows-aarch64 macos-aarch64 macos-x86_64 linux-x86_64 linux-aarch64; do
            ext=""; case "$os_arch" in windows-*) ext=".exe" ;; esac
            for bin in vibefork vibefork-tray; do
              test -f "release/$bin-$os_arch$ext" || { echo "missing $bin-$os_arch$ext" >&2; exit 1; }
            done
          done
          for package in vibefork-windows-x86_64.msi vibefork-windows-x86_64-portable.zip               vibefork-windows-aarch64.msi vibefork-windows-aarch64-portable.zip vibefork-macos-universal.dmg               vibefork-linux-x86_64.AppImage vibefork-linux-x86_64.AppImage.zsync vibefork-linux-x86_64.tar.gz               vibefork-linux-aarch64.AppImage vibefork-linux-aarch64.AppImage.zsync vibefork-linux-aarch64.tar.gz; do
            test -f "release/$package" || { echo "missing $package" >&2; exit 1; }
          done
          (cd release && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt release/ && cat release/SHA256SUMS.txt
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # The same checks the agent runs on its release channel, with throwaway keys.
      - name: Signed with throwaway keys, the release passes `vibefork-sign verify`
        run: |
          cargo build --release --locked -p vf-sign
          sign=target/release/vibefork-sign
          keys="$RUNNER_TEMP/keys"; mkdir "$keys"
          $sign keygen "$keys/root.key" "$keys/root.pub"
          $sign keygen "$keys/sub.key" "$keys/sub.pub"
          $sign certify-subkey "$keys/root.key" "$keys/sub.pub" release 1
          cp -r release "$RUNNER_TEMP/check"
          cp "$keys/sub.pub.cert.json" "$RUNNER_TEMP/check/subkey.cert.json"
          cp "$keys/sub.pub.cert.sig" "$RUNNER_TEMP/check/subkey.cert.sig"
          $sign release "$RUNNER_TEMP/check" "$keys/sub.key" "$VERSION" --days 1
          $sign verify "$RUNNER_TEMP/check" --root "$keys/root.pub"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ env.VERSION }}
          path: release/
          if-no-files-found: error

  draft:
    if: github.event_name != 'pull_request'
    needs: [version, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: release
      - name: Draft release
        run: |
          tag="v$VERSION"
          # A published release is never replaced; an earlier draft of the same version is.
          gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" > existing.txt
          while read -r id draft; do
            if [ "$draft" != "true" ]; then
              echo "release $tag is already published" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done < existing.txt
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --draft $pre \
            --target "$GITHUB_SHA" \
            --title "Vibefork v$VERSION" \
            --notes "Vibefork agent $VERSION. Every file is listed with its SHA-256 in \`SHA256SUMS.txt\` and in the signed update manifest (\`manifest.json\`, \`manifest.sig\`, release subkey certificate \`subkey.cert.json\`, \`subkey.cert.sig\`)." \
            release/*
