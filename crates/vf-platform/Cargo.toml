[package]
name = "vf-platform"
description = "Everything OS-specific: native dialogs, secret store (Keychain / Credential Manager / Secret Service), `vibefork://` registration, autostart, paths and disk info."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test builds only: every confirm dialog is approved without being shown.
insecure-auto-approve = []
# Development only: honour `extraOrigins` / `VF_EXTRA_ORIGINS`. Release builds must not enable it (checked in CI).
dev-extra-origins = []
# Development only: honour `VF_PROMPTS_DIR`. Release builds must not enable it (checked in CI).
dev-prompts-dir = []
# Enables reading provider credentials from environment variables in development builds.
dev-env-secrets = []
# Tests only: an in-memory secret store instead of the OS one. Release builds must not enable it (checked in CI).
test-store = []

[dependencies]
vf-core.workspace = true
vf-journal.workspace = true
vf-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
string_slice = "deny"            # byte offsets split UTF-8: use `get(..)` or char APIs
print_stdout = "warn"
print_stderr = "warn"

# Secret store: Credential Manager / Keychain / Secret Service.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
