[package]
name = "vf-sandbox"
description = "`Sandbox` trait; the only implementation is `NoopSandbox` (no isolation yet)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
