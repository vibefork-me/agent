[package]
name = "vf-sandbox"
description = "Isolation of untrusted execution: policy, launcher, Landlock on Linux, Seatbelt on macOS, AppContainer on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vf-core.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation",
    "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Threading",
] }

# Test helper with `sandbox-exec` (the agent binary has the same command).
[[bin]]
name = "vf-sandbox-helper"
path = "src/bin/helper.rs"
test = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
string_slice = "deny"            # byte offsets split UTF-8: use `get(..)` or char APIs
print_stdout = "warn"
print_stderr = "warn"
