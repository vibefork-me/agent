# cargo-deny: licenses, advisories, duplicates, sources. See AGENTS.md, "Dependencies".

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (no known vulnerability); pulled in only on Linux by the tray: tray-icon → gtk 0.18 → glib macros.
    { id = "RUSTSEC-2024-0370", reason = "Linux tray only (gtk 0.18); replaced when tray-icon moves to gtk4" },
    # crypto-bigint 0.5 (via p256 0.13 → elliptic-curve): timing variability on secret integers. vf-auth only verifies
    # browser ECDSA signatures (public key, signature and challenge are public); no secret scalar is used outside tests.
    { id = "RUSTSEC-2026-0387", reason = "verify-only use of p256: no secret integers; upgrade when p256 moves to crypto-bigint 0.7" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "MPL-2.0",              # file-level copyleft; used unmodified (option-ext, via the tray's `dirs`)
    "CDLA-Permissive-2.0",  # Mozilla's root certificates as data (webpki-roots, via reqwest + rustls)
]
confidence-threshold = 0.9

# Our own crates (FSL-1.1-MIT) are not published (`publish = false`) and are skipped here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies without versions (none of them is published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
