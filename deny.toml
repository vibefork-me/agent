# cargo-deny: licenses, advisories, duplicates, sources. See AGENTS.md, "Dependencies".

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (no known vulnerability); pulled in only on Linux by the tray: tray-icon → gtk 0.18 → glib macros.
    { id = "RUSTSEC-2024-0370", reason = "Linux tray only (gtk 0.18); replaced when tray-icon moves to gtk4" },
    # Unmaintained (no known vulnerability): zvariant / zbus_names / zvariant_derive were merged into zbus 6.
    # Pulled in by the tray's D-Bus crates (ksni, notify-rust → zbus 5); dropped when they move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "tray D-Bus (zbus 5 → zvariant); goes with zbus 6 in ksni / notify-rust" },
    { id = "RUSTSEC-2026-0371", reason = "tray D-Bus (zbus 5 → zbus_names / zvariant_derive); goes with zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "tray D-Bus (zbus 5 → zbus_names / zvariant_derive); goes with zbus 6" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "MPL-2.0",              # file-level copyleft; used unmodified (option-ext, via the tray's `dirs`)
    "Unlicense",            # public-domain dedication (ksni: the Linux tray, StatusNotifierItem over zbus)
    "CDLA-Permissive-2.0",  # Mozilla's root certificates as data (webpki-roots, via reqwest + rustls)
]
confidence-threshold = 0.9

# Our own crates (FSL-1.1-MIT) are not published (`publish = false`) and are skipped here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies without versions (none of them is published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies only from our own organization.
allow-org = { github = ["vibefork-me"] }
