[package]
name = "copilot-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
github-copilot-sdk = "=1.0.28"
vf-github = { path = "../../crates/vf-github" }
vf-protocol = { path = "../../crates/vf-protocol" }
vf-providers = { path = "../../crates/vf-providers" }
keyring = { version = "3", features = ["windows-native"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
